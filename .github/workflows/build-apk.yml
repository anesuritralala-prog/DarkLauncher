name: Build Dark Launcher APK

on:
  push:
    branches: [ v3_openjdk ]
  pull_request:
    branches: [ v3_openjdk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Accept Android licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "ndk;28.2.13676358"
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew clean :app_pojavlauncher:assembleDebug -x lint
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: dark-launcher-apk
        path: app_pojavlauncher/build/outputs/apk/debug/*.apk
    
    - name: Create Release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: build-${{ github.run_number }}
        release_name: Dark Launcher APK Build ${{ github.run_number }}
        body: |
          APK compilado automáticamente de Dark Launcher
          - Nombre: Dark Launcher
          - Tema: Rojo y Negro
          - Sin botón Wiki
          - Discord: https://discord.gg/x65mp59zxG
        draft: false
        prerelease: false
