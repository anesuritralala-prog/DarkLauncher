name: Build Dark Launcher APK

on:
  push:
    branches: [ v3_openjdk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # Use 'packages' to install required platforms and NDK
        packages: |
          platforms;android-33
          ndk;28.2.13676358
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew clean :app_pojavlauncher:assembleDebug -x lint -q

    - name: Prepare git for release
      if: success()
      run: |
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: dark-launcher-apk
        path: app_pojavlauncher/build/outputs/apk/debug/**/*.apk
        retention-days: 90
    
    - name: Upload to Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: app_pojavlauncher/build/outputs/apk/debug/**/*.apk
        tag_name: dark-launcher-${{ github.run_number }}
        name: Dark Launcher ${{ github.run_number }}
        body: |
          APK de Dark Launcher compilado
          
          **Características:**
          - Diseño: Rojo y Negro
          - Sin botón Wiki
          - Discord: https://discord.gg/x65mp59zxG
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
